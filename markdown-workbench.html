<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markdown Workbench</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style id="app-style">
/* Layout: a writing desk — toolbar on top, outline | source sheet | rendered page, status line below. */
:root{
  --bg:#e9eeee; --panel:#f6f8f8; --sheet:#ffffff; --line:#d6dedf; --text:#162224; --muted:#5b6a6c;
  --accent:#0c6872; --accent-weak:#d9eced; --hover:#e3eaea; --sel-a:rgba(12,104,114,.22); --cur-line:rgba(12,104,114,.055);
  --danger:#b3372d; --ok:#2a7a48; --warn:#a46200;
  --s-mk:#8d9a9c; --s-h:#0c5c66; --s-code:#8c4a12; --s-link:#1c5cae; --s-url:#7d8b8d; --s-em:#7a3a95; --s-tag:#a2325a; --s-quote:#55686b; --s-fm:#5d61a0; --s-li:#c0631a;
  --find:#ffe270; --find-cur:#ffaf45;
  --shadow:0 12px 36px rgba(16,34,36,.16);
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ed-size:14.5px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1516; --panel:#151d1e; --sheet:#182122; --line:#2a3637; --text:#e1e9e9; --muted:#8e9d9e;
    --accent:#5fc0c8; --accent-weak:#1d3638; --hover:#1f2a2b; --sel-a:rgba(95,192,200,.28); --cur-line:rgba(95,192,200,.06);
    --danger:#ef7a6f; --ok:#61c486; --warn:#e2a04a;
    --s-mk:#5f7072; --s-h:#7fd3da; --s-code:#e0a46a; --s-link:#7fb0f2; --s-url:#6f8284; --s-em:#cf9be8; --s-tag:#ec8aab; --s-quote:#9db0b2; --s-fm:#a3a7e6; --s-li:#eb9a55;
    --find:#6b5a12; --find-cur:#9a5d10; --shadow:0 12px 36px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1516; --panel:#151d1e; --sheet:#182122; --line:#2a3637; --text:#e1e9e9; --muted:#8e9d9e;
  --accent:#5fc0c8; --accent-weak:#1d3638; --hover:#1f2a2b; --sel-a:rgba(95,192,200,.28); --cur-line:rgba(95,192,200,.06);
  --danger:#ef7a6f; --ok:#61c486; --warn:#e2a04a;
  --s-mk:#5f7072; --s-h:#7fd3da; --s-code:#e0a46a; --s-link:#7fb0f2; --s-url:#6f8284; --s-em:#cf9be8; --s-tag:#ec8aab; --s-quote:#9db0b2; --s-fm:#a3a7e6; --s-li:#eb9a55;
  --find:#6b5a12; --find-cur:#9a5d10; --shadow:0 12px 36px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--f-ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
kbd{font:11px var(--f-mono);padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel);color:var(--muted)}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* toolbar */
.tb{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.mark{font:600 12px var(--f-mono);color:var(--sheet);background:var(--accent);border-radius:5px;padding:2px 6px}
.fname{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:6px;padding:4px 8px;max-width:240px;color:var(--muted);min-width:0}
.fname:hover{border-color:var(--line);color:var(--text)}
.fname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.grp{display:flex;gap:2px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:none;color:var(--text)}
.ib:hover:not(:disabled){background:var(--hover);border-color:var(--line)}
.ib:disabled{opacity:.35;cursor:default}
.ib.on{background:var(--accent-weak);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--sheet);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}

/* work area */
.work{flex:1;min-height:0;display:flex;gap:12px;position:relative}
.pane{background:var(--sheet);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;min-height:0;flex:1 1 0;overflow:hidden}
#outline{flex:0 0 220px;background:var(--panel)}
.ohead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
#olist{flex:1;overflow:auto;padding:0 6px 12px}
#olist button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:5px;padding:4px 8px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#olist button:hover{background:var(--hover);color:var(--text)}
#olist button.on{color:var(--accent);background:var(--accent-weak)}
#olist button.l1{color:var(--text);font-weight:600}
#olist .empty{font-size:12.5px;color:var(--muted);padding:6px 8px}
body.no-outline #outline{display:none}
body.view-edit #pvPane{display:none}
body.view-preview #edPane{display:none}

/* format bar */
.fmt{display:flex;align-items:center;gap:1px;padding:5px 6px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.fmt .ib{height:28px;min-width:28px;padding:0 5px;color:var(--muted)}
.fmt .ib:hover{color:var(--text)}
.fmt .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.fmt b,.fmt i,.fmt s{font-family:var(--f-ui);font-size:14px;color:inherit}

/* find bar */
.findbar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.findbar input{height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--sheet);min-width:0;flex:1 1 140px;outline:none;font:13px var(--f-mono)}
.findbar input:focus{border-color:var(--accent)}
.findbar input.bad{border-color:var(--danger)}
.findbar .ib{height:28px;min-width:28px;padding:0 6px}
.findbar .opt{font:11.5px var(--f-mono);color:var(--muted)}
.findbar .opt.on{color:var(--accent);background:var(--accent-weak)}
.fcount{font-size:12px;color:var(--muted);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}

/* editor */
.edscroll{flex:1;overflow:auto;position:relative;min-height:0}
.edinner{position:relative;max-width:860px;margin:0 auto;min-height:100%}
#hl,#mk,#ta{font-family:var(--f-mono);font-size:var(--ed-size);line-height:1.75;padding:22px 28px 45vh;margin:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;letter-spacing:0;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
#hl,#mk{position:absolute;top:0;left:0;right:0;pointer-events:none}
#hl{color:var(--text)}
#hl>div.cur{background:var(--cur-line);box-shadow:-28px 0 0 var(--cur-line),28px 0 0 var(--cur-line)}
#mk{color:transparent}
#mk mark{background:var(--find);color:transparent;border-radius:2px}
#mk mark.cur{background:var(--find-cur)}
#ta{position:relative;display:block;width:100%;min-height:100%;border:0;outline:0;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--text)}
#ta::selection{background:var(--sel-a);color:transparent}
#ta.plain{color:var(--text)}
#ta.plain::selection{color:var(--text)}
#hl.ghost,#hl.ghost *{color:transparent!important}
#ta::placeholder{color:var(--muted)}
.s-mk{color:var(--s-mk)} .s-h{color:var(--s-h)} .s-code{color:var(--s-code)} .s-lang{color:var(--s-url)} .s-link{color:var(--s-link)} .s-url{color:var(--s-url)}
.s-strong{color:var(--text);text-shadow:0 0 .01px currentColor} .s-em{color:var(--s-em)} .s-del{color:var(--s-mk);text-decoration:line-through} .s-tag{color:var(--s-tag)}
.s-quote{color:var(--s-quote)} .s-qmk{color:var(--s-mk)} .s-li{color:var(--s-li)} .s-task{color:var(--s-li)} .s-fm{color:var(--s-fm)} .s-fn{color:var(--s-link)} .s-pipe{color:var(--s-mk)}

/* preview */
.pvhead{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);min-height:39px}
.pvhead .spacer{flex:1}
.pvscroll{flex:1;overflow:auto;min-height:0;background:var(--md-paper)}
.pre-wrap{position:relative}
.cbtn{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--sheet);border-radius:5px;font:11px var(--f-ui);padding:2px 8px;color:var(--muted);opacity:0;transition:opacity .12s}
.md pre:hover .cbtn,.cbtn:focus{opacity:1}

/* status */
.st{display:flex;align-items:center;gap:14px;padding-block:7px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.st .ok{color:var(--ok)} .st .warn{color:var(--warn)}

/* menus, modals, toasts */
.menu{position:fixed;z-index:75;min-width:230px;max-width:330px;background:var(--sheet);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:5px;max-height:82vh;overflow:auto}
.mi{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;border:0;background:none;padding:6px 10px;border-radius:5px;text-align:left;font-size:13px}
.mi:hover:not(:disabled),.mi:focus-visible{background:var(--accent-weak);outline:none}
.mi:disabled{opacity:.4;cursor:default}
.mi .chk{width:14px;display:inline-block;color:var(--accent)}
.msep{height:1px;background:var(--line);margin:4px 6px}
.mhead{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 10px 3px;font-weight:600}
.modal-ov{position:fixed;inset:0;background:rgba(10,20,22,.4);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:440px;max-width:100%;max-height:90%;display:flex;flex-direction:column}
.modal.wide{width:720px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px 18px}
.mh h2{font-size:16px;margin:0}
.mb{padding:4px 18px 8px;overflow:auto}
.mb p{margin:0 0 10px;color:var(--muted)}
.mb label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.mb input.fi{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--bg);outline:none;font:13px var(--f-mono);color:var(--text)}
.mb input.fi:focus{border-color:var(--accent)}
.mb .row2{display:flex;gap:10px}
.mb .row2 label{flex:1}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px}
.keys{width:100%;border-collapse:collapse;font-size:13px}
.keys td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.keys td:first-child{white-space:nowrap;width:1%;padding-right:16px}
.keys h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 4px}
.keys code{font:12px var(--f-mono);background:var(--panel);padding:1px 4px;border-radius:3px}
#toasts{position:fixed;bottom:calc(44px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:70;align-items:center;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--sheet);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);animation:tin .15s ease-out}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}.cbtn{transition:none}}
#dropOv{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--accent) 16%,transparent);border:3px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--accent);pointer-events:none}

@media (max-width: 900px){
  #outline{position:absolute;left:0;top:0;bottom:0;width:240px;z-index:20;box-shadow:var(--shadow)}
  .bname{display:none}
}
@media (max-width: 760px){
  body.view-split .work{flex-direction:column}
  #hl,#mk,#ta{padding:16px 16px 45vh}
  #hl>div.cur{box-shadow:-16px 0 0 var(--cur-line),16px 0 0 var(--cur-line)}
  .st .hide-sm{display:none}
  .fname{max-width:140px}
}
</style>
<style id="md-style">
:root{
  --md-paper:#ffffff; --md-text:#1b2425; --md-muted:#5d6b6d; --md-line:#dbe2e3; --md-accent:#0c6872; --md-code-bg:#f1f5f5; --md-mark:#fff0a3;
  --md-c-note:#2563c9; --md-c-tip:#2a7a48; --md-c-imp:#7a45c4; --md-c-warn:#a46200; --md-c-caution:#b3372d;
  --c-kw:#a2325a; --c-str:#2a7a48; --c-num:#1d5fc0; --c-com:#8a979a; --c-fn:#6b3fa0; --c-type:#0c6872; --c-lit:#b45a09; --c-var:#a24b0f; --c-key:#0c5c66; --c-add:#2a7a48; --c-del:#b3372d;
  --md-serif:"Source Serif 4",Charter,"Iowan Old Style",Georgia,serif; --md-sans:"Instrument Sans",system-ui,sans-serif; --md-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --md-paper:#182122; --md-text:#e2eaea; --md-muted:#93a2a3; --md-line:#2d3a3b; --md-accent:#6cc8cf; --md-code-bg:#11191a; --md-mark:#5c4f12;
    --md-c-note:#7fb0f2; --md-c-tip:#61c486; --md-c-imp:#bf9bf0; --md-c-warn:#e2a04a; --md-c-caution:#ef7a6f;
    --c-kw:#ec8aab; --c-str:#8fd59b; --c-num:#7fb2ff; --c-com:#6e8183; --c-fn:#cf9be8; --c-type:#6cc8cf; --c-lit:#f2a65a; --c-var:#e0a46a; --c-key:#7fd3da; --c-add:#61c486; --c-del:#ef7a6f;
  }
}
:root[data-theme="dark"]{
  --md-paper:#182122; --md-text:#e2eaea; --md-muted:#93a2a3; --md-line:#2d3a3b; --md-accent:#6cc8cf; --md-code-bg:#11191a; --md-mark:#5c4f12;
  --md-c-note:#7fb0f2; --md-c-tip:#61c486; --md-c-imp:#bf9bf0; --md-c-warn:#e2a04a; --md-c-caution:#ef7a6f;
  --c-kw:#ec8aab; --c-str:#8fd59b; --c-num:#7fb2ff; --c-com:#6e8183; --c-fn:#cf9be8; --c-type:#6cc8cf; --c-lit:#f2a65a; --c-var:#e0a46a; --c-key:#7fd3da; --c-add:#61c486; --c-del:#ef7a6f;
}
.md{font-family:var(--md-serif);font-size:var(--md-size,17px);line-height:1.68;color:var(--md-text);max-width:70ch;margin:0 auto;padding:30px 32px 30vh;overflow-wrap:break-word;font-optical-sizing:auto}
.md>:first-child{margin-top:0}
.md.big>*{content-visibility:auto;contain-intrinsic-size:auto 3em}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font-family:var(--md-serif);line-height:1.22;margin:1.6em 0 .55em;text-wrap:balance;font-weight:650;letter-spacing:-.012em;scroll-margin-top:12px}
.md h1{font-size:2.05em;font-weight:700;letter-spacing:-.02em}
.md h2{font-size:1.5em;padding-bottom:.25em;border-bottom:1px solid var(--md-line)}
.md h3{font-size:1.22em}
.md h4{font-size:1.04em}
.md h5,.md h6{font-family:var(--md-sans);font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--md-muted)}
.md .anchor{margin-left:.35em;color:var(--md-muted);text-decoration:none;opacity:0;font-weight:400;font-size:.8em}
.md h1:hover .anchor,.md h2:hover .anchor,.md h3:hover .anchor,.md h4:hover .anchor,.md h5:hover .anchor,.md h6:hover .anchor,.md .anchor:focus{opacity:1}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table,.md dl,.md details,.md .callout,.md figure{margin:0 0 1.05em}
.md a{color:var(--md-accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}
.md strong{font-weight:650}
.md ul,.md ol{padding-left:1.6em}
.md li{margin:.22em 0}
.md li>ul,.md li>ol{margin:.2em 0 0}
.md li>p{margin:.4em 0}
.md li.task-item{list-style:none;position:relative}
.md li.task-item>input.task{position:absolute;left:-1.45em;top:.42em;margin:0;width:.95em;height:.95em;accent-color:var(--md-accent);cursor:pointer}
.md li.task-item>p>input.task{margin:0 .45em 0 -1.45em;accent-color:var(--md-accent)}
.md blockquote{padding:.15em 0 .15em 1.1em;border-left:3px solid var(--md-line);color:var(--md-muted);font-style:italic}
.md blockquote>:last-child,.md .callout>:last-child,.md li>:last-child{margin-bottom:0}
.md .callout{--c:var(--md-c-note);border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);padding:.65em 1em;border-radius:0 6px 6px 0}
.md .callout-title{font-family:var(--md-sans);font-weight:600;font-size:.82em;text-transform:uppercase;letter-spacing:.07em;color:var(--c);margin:0 0 .3em}
.md .callout-tip{--c:var(--md-c-tip)} .md .callout-important{--c:var(--md-c-imp)} .md .callout-warning{--c:var(--md-c-warn)} .md .callout-caution{--c:var(--md-c-caution)}
.md code{font-family:var(--md-mono);font-size:.82em;background:var(--md-code-bg);padding:.12em .36em;border-radius:4px}
.md pre{background:var(--md-code-bg);border:1px solid var(--md-line);border-radius:8px;padding:14px 16px;overflow:auto;position:relative;line-height:1.55;font-size:.82em}
.md pre code{background:none;padding:0;font-size:1em;white-space:pre}
.md pre[data-lang]::before{content:attr(data-lang);position:absolute;top:6px;right:10px;font:11px var(--md-sans);color:var(--md-muted);text-transform:lowercase}
.md pre[data-lang]:hover::before{opacity:0}
.md table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-family:var(--md-sans);font-size:.86em;font-variant-numeric:tabular-nums;width:max-content}
.md th,.md td{border:1px solid var(--md-line);padding:6px 12px;text-align:left}
.md th{background:var(--md-code-bg);font-weight:600}
.md [align="center"]{text-align:center} .md [align="right"]{text-align:right}
.md tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--md-code-bg) 55%,transparent)}
.md table.fm{font-size:.8em;margin-bottom:1.6em}
.md table.fm th{background:none;color:var(--md-muted);font-weight:500}
.md img{max-width:100%;height:auto;border-radius:4px}

title: Harbor Lights 2.3
owner: Platform team
status: draft

# Harbor Lights 2.3 release notes

Harbor Lights is a **status page generator** for small teams. This release focuses on *faster builds*, stricter ~~YAML~~ config validation, and accessible themes.[^perf]

> [!TIP]
> This is a sample document. Edit on the left and the preview updates as you type. Double-click anything in the preview to jump to its source, and tick the checkboxes below to update the Markdown.

## Highlights

- Incremental builds: only changed pages are rebuilt
- New `hl check` command validates your config before deploy
- Two new themes: **Tidewater** and **Signal**
  - Both meet WCAG 2.2 AA contrast
  - Both support dark mode

## Upgrade checklist

- [x] Back up `harbor.yml`
- [x] Read the breaking changes below
- [ ] Run `hl check` and fix any warnings
- [ ] Deploy to staging

## Build times

| Site size | 2.2 | 2.3 | Change |
|:--|--:|--:|:-:|
| 50 pages | 4.1 s | 1.2 s | −71% |
| 500 pages | 38 s | 6.4 s | −83% |
| 5,000 pages | 6 min 10 s | 52 s | −86% |

## Breaking changes

1. `incidents.yml` is now an `incidents/` folder, one file per incident
2. The `--legacy` flag was removed
3. Node 20 or newer is required

```yaml
# harbor.yml
site:
  name: "Acme Status"
  theme: tidewater
checks:
  - url: https://api.example.com/health
    interval: 30s
    retries: 3
```

```js
// checks/latency.js: a custom check
export default async function check({ fetch }) {
  const started = Date.now();
  const res = await fetch("https://api.example.com/ping");
  return { ok: res.ok, latencyMs: Date.now() - started };
}
```

> Status pages are read in the worst five minutes of someone's week. Make them fast and plain.
> — Harbor Lights design notes

---

Questions? Read the [migration guide](https://example.com/docs/migrate) or press <kbd>Ctrl</kbd> + <kbd>/</kbd> for shortcuts.

[^perf]: Measured on a 4-core CI runner with a warm cache.

  else if (mod && e.altKey && /^Digit[0-6]$/.test(e.code)) setHeading(+e.code.slice(5));
  else if (e.altKey && !mod && k === 'ArrowUp') moveLines(-1);
  else if (e.altKey && !mod && k === 'ArrowDown') moveLines(1);
  else if (k === 'Tab' && !mod && !e.altKey) handled = onTab(e.shiftKey);
  else if (k === 'Enter' && !mod && !e.shiftKey && !e.altKey && !e.isComposing) handled = onEnter();
  else if (k === 'Escape' && F.open) closeFind();
  else if (!mod && !e.altKey && ta.selectionStart !== ta.selectionEnd && ['*', '_', '`', '~', '=', '[', '(', '"'].includes(k)) {
    const pair = { '[': ']', '(': ')' }[k] || k;
    const s = ta.selectionStart, en = ta.selectionEnd, sel = ta.value.slice(s, en);

function globalKeys(e) {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();

  if (mod && k === 's') { e.preventDefault(); save(); }
  else if (mod && k === 'o') { e.preventDefault(); openFile(); }
  else if (mod && k === 'f' && !e.shiftKey) { e.preventDefault(); if (S.view === 'preview') setView('split'); openFind(); }
  else if (mod && e.shiftKey && k === 'p') { e.preventDefault(); cycleView(); }
  else if (mod && e.key === '\\') { e.preventDefault(); setOutline(!S.outline); }
  else if (mod && e.key === '/') { e.preventDefault(); showHelp(); }
  else if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); S.edSize = Math.min(22, S.edSize + 1); S.mdSize = Math.min(24, S.mdSize + 1); applySizes(); savePrefs(); }
  else if (mod && e.key === '-') { e.preventDefault(); S.edSize = Math.max(11, S.edSize - 1); S.mdSize = Math.max(13, S.mdSize - 1); applySizes(); savePrefs(); }
  else if (e.key === 'Escape') { closeMenu(); if (F.open && document.activeElement !== ta) closeFind(); }
}

function init() {
  wire();
  const th = store.get('mdwb.theme'); if (th) applyTheme(th);
  try { Object.assign(S, JSON.parse(store.get('mdwb.prefs') || '{}')); } catch {}
  if (innerWidth <= 900) S.outline = false;
  ta.spellcheck = S.spell;
  applySizes();
  setView(['edit', 'split', 'preview'].includes(S.view) ? S.view : 'split');
  setOutline(S.outline);
  let restored = false;
  try {
    const sess = JSON.parse(store.get('mdwb.session') || 'null');
    if (sess && typeof sess.text === 'string' && sess.text.trim()) { setText(sess.text, sess.name || 'untitled.md', { dirty: !sess.saved }); restored = true; }
  } catch {}
  if (!restored) setText(sampleText(), 'harbor-lights-2.3.md');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { sizeEditor(); pvBlocks = null; });
  getDownloads();
}
init();
